<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XELIRA • Annonces</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0a0a0a;
    font-family:Inter,sans-serif;
    color:#fff;
}
header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid #1f1f1f;
}
header h1{color:#ff007f;}
.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}
.card{
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    opacity:0;
    transform:translateY(15px);
    animation:fadeIn 0.5s forwards;
    transition:transform 0.3s, box-shadow 0.3s;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #ff007f;
}
input, textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #1f1f1f;
    background:#000;
    color:#fff;
}
button{
    background:#ff007f;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
footer{
    text-align:center;
    padding:20px;
    border-top:1px solid #1f1f1f;
    color:#777;
}
.announcement-date{
    font-size:12px;
    color:#aaa;
    margin-bottom:5px;
}
@keyframes fadeIn{
    to{opacity:1; transform:translateY(0);}
}
.typewriter{
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #ff007f;
    animation:typing 1s steps(40,end) forwards;
}
@keyframes typing{
    from{width:0;}
    to{width:100%;}
}
</style>
</head>

<body>

<header>
    <h1>📢 Annonces XELIRA</h1>
    <p>Restez informé des dernières nouvelles</p>
</header>

<div id="root" class="container"></div>

<footer>© Xelira Studio</footer>

<script type="text/babel">
const { useState, useEffect } = React;

function TypeWriter({text}) {
    const [display, setDisplay] = useState("");

    useEffect(()=>{
        let i=0;
        const interval = setInterval(()=>{
            setDisplay(text.slice(0,i+1));
            i++;
            if(i>=text.length) clearInterval(interval);
        },15); // vitesse d'écriture
        return ()=>clearInterval(interval);
    },[text]);

    return <p className="typewriter">{display}</p>;
}

function App(){
    const fakeAnnouncements = [
        {title:"Nouvelle version XELIRA", text:"La version 2.0 est maintenant disponible !", date:"2026-02-13"},
        {title:"Maintenance programmée", text:"Serveur en maintenance ce soir de 23h à 01h.", date:"2026-02-12"},
        {title:"Astuce du jour", text:"Téléchargez vos vidéos TikTok sans watermark facilement.", date:"2026-02-10"}
    ];

    const [announcements, setAnnouncements] = useState([]);
    const [title, setTitle] = useState("");
    const [text, setText] = useState("");

    useEffect(()=>{
        const saved = JSON.parse(localStorage.getItem("xelira_announcements"));
        if(saved){
            setAnnouncements(saved);
        }else{
            setAnnouncements(fakeAnnouncements);
            localStorage.setItem("xelira_announcements", JSON.stringify(fakeAnnouncements));
        }
    },[]);

    const addAnnouncement = ()=>{
        if(!title || !text) return alert("Veuillez remplir tous les champs");

        const newAnnouncement = {title, text, date: new Date().toISOString().slice(0,10)};
        const updated = [newAnnouncement, ...announcements];

        setAnnouncements(updated);
        localStorage.setItem("xelira_announcements", JSON.stringify(updated));

        setTitle(""); setText("");
    };

    return(
        <div>
            <h2>Ajouter une annonce</h2>
            <input 
                placeholder="Titre de l'annonce"
                value={title}
                onChange={e=>setTitle(e.target.value)}
            />
            <textarea 
                placeholder="Texte de l'annonce"
                value={text}
                onChange={e=>setText(e.target.value)}
            />
            <button onClick={addAnnouncement}>Publier</button>

            <hr style={{margin:"25px 0",borderColor:"#1f1f1f"}}/>

            <h2>Liste des annonces</h2>
            {announcements.map((a,index)=>(
                <div className="card" key={index} style={{animationDelay:`${index*0.1}s`}}>
                    <div className="announcement-date">{a.date}</div>
                    <strong>{a.title}</strong>
                    <TypeWriter text={a.text}/>
                </div>
            ))}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
