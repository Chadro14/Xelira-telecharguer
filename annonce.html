<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XELIRA • Produits</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0a0a0a;
    font-family:Inter,sans-serif;
    color:#fff;
}
header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid #1f1f1f;
}
header h1{color:#ff007f;}
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:20px;
}
.card{
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:16px;
    padding:15px;
    text-align:center;
    transition:transform 0.3s, box-shadow 0.3s;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #ff007f;
}
.card img{
    width:100%;
    border-radius:12px;
    margin-bottom:10px;
}
.card h3{
    margin:5px 0;
}
.card p{
    font-size:14px;
    color:#ccc;
}
.price{
    font-weight:bold;
    margin:5px 0 10px 0;
}
button{
    background:#ff007f;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:background 0.3s;
}
button:hover{
    background:#e60073;
}
footer{
    text-align:center;
    padding:20px;
    border-top:1px solid #1f1f1f;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Produits XELIRA</h1>
    <p>Choisissez un produit et contactez directement via WhatsApp</p>
</header>

<div id="root" class="container"></div>

<footer>© Xelira Studio</footer>

<script type="text/babel">
const { useState } = React;

// Remplace ce numéro par le tien
const whatsappNumber = "243861009310";

function App(){

    const products = [
        {
            name:"Xelira-XMD bot ",
            image:"https://files.catbox.moe/96sfzx.jpg",
            description:"Bot WhatsApp & Telegram bientôt disponible — Xelira-XMD, avec de nouvelles fonctionnalités avancées et bien plus encore !".",
            price:"0.0$"
        },
        {
            name:"Xelira Downloader",
            image:"https://via.placeholder.com/300x200.png?text=Xelira+Downloader",
            description:"Téléchargez des vidéos sans watermark.",
            price:"1500 FC"
        },
        {
            name:"Xelira Monetizer",
            image:"https://via.placeholder.com/300x200.png?text=Xelira+Monetizer",
            description:"Monétisez vos comptes sociaux facilement.",
            price:"5000 FC"
        },
        {
            name:"Xelira Pro Tools",
            image:"https://via.placeholder.com/300x200.png?text=Xelira+Pro+Tools",
            description:"Pack complet pour professionnels du social media.",
            price:"10000 FC"
        }
    ];

    const handleContact = (productName) => {
        const message = encodeURIComponent(`Bonjour, je suis intéressé par : ${productName}`);
        window.open(`https://wa.me/${whatsappNumber}?text=${message}`, "_blank");
    };

    return(
        <div className="grid">
            {products.map((p,index)=>(
                <div className="card" key={index}>
                    <img src={p.image} alt={p.name}/>
                    <h3>{p.name}</h3>
                    <p>{p.description}</p>
                    <div className="price">{p.price}</div>
                    <button onClick={()=>handleContact(p.name)}>📩 Contacter</button>
                </div>
            ))}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
