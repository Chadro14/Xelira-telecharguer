<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XELIRA • Avis & Commentaires</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0a0a0a;
    font-family:Inter,sans-serif;
    color:#fff;
}
header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid #1f1f1f;
}
header h1{color:#ff007f}
.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}
.card{
    background:#111;
    border:1px solid #1f1f1f;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    opacity:0;
    transform:translateY(15px);
    animation:fadeIn 0.5s forwards;
    transition:transform 0.3s, box-shadow 0.3s;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #ff007f;
}
.stars{
    color:#ffcc00;
    font-size:18px;
    margin-bottom:5px;
}
input, textarea, select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #1f1f1f;
    background:#000;
    color:#fff;
}
button{
    background:#ff007f;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
footer{
    text-align:center;
    padding:20px;
    border-top:1px solid #1f1f1f;
    color:#777;
}

/* Animations */
@keyframes fadeIn{
    to{opacity:1; transform:translateY(0);}
}
.typewriter{
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #ff007f;
    animation:typing 1s steps(40, end) forwards;
}
@keyframes typing{
    from{width:0;}
    to{width:100%;}
}
</style>
</head>

<body>

<header>
    <h1>⭐ Avis & Commentaires</h1>
    <p>Ce que nos utilisateurs pensent de Xelira</p>
</header>

<div id="root" class="container"></div>

<footer>© Xelira Studio</footer>

<script type="text/babel">

const { useState, useEffect } = React;

function TypeWriter({text}) {
    const [display, setDisplay] = useState("");

    useEffect(()=>{
        let i=0;
        const interval = setInterval(()=>{
            setDisplay(text.slice(0,i+1));
            i++;
            if(i>=text.length) clearInterval(interval);
        },20); // vitesse d'écriture
        return ()=>clearInterval(interval);
    },[text]);

    return <p className="typewriter">{display}</p>;
}

function App(){

    const fakeComments = [
        {name:"Kevin", text:"Application incroyable 🔥", rating:5},
        {name:"Sarah", text:"Téléchargement rapide et simple", rating:4},
        {name:"David", text:"Très bon service client", rating:5}
    ];

    const [comments, setComments] = useState([]);
    const [name, setName] = useState("");
    const [text, setText] = useState("");
    const [rating, setRating] = useState(5);

    useEffect(()=>{
        const saved = JSON.parse(localStorage.getItem("xelira_comments"));
        if(saved){
            setComments(saved);
        }else{
            setComments(fakeComments);
            localStorage.setItem("xelira_comments", JSON.stringify(fakeComments));
        }
    },[]);

    const addComment = ()=>{
        if(!name || !text) return alert("Veuillez remplir tous les champs");

        const newComment = {name,text,rating};
        const updated = [newComment, ...comments];

        setComments(updated);
        localStorage.setItem("xelira_comments", JSON.stringify(updated));

        setName("");
        setText("");
        setRating(5);
    };

    return(
        <div>

            <h2>Laisser un avis</h2>

            <input 
                placeholder="Votre nom"
                value={name}
                onChange={e=>setName(e.target.value)}
            />

            <textarea
                placeholder="Votre commentaire"
                value={text}
                onChange={e=>setText(e.target.value)}
            />

            <select value={rating} onChange={e=>setRating(Number(e.target.value))}>
                <option value="5">5 étoiles</option>
                <option value="4">4 étoiles</option>
                <option value="3">3 étoiles</option>
                <option value="2">2 étoiles</option>
                <option value="1">1 étoile</option>
            </select>

            <br/><br/>

            <button onClick={addComment}>Publier</button>

            <hr style={{margin:"25px 0",borderColor:"#1f1f1f"}}/>

            <h2>Avis des utilisateurs</h2>

            {comments.map((c,index)=>(
                <div className="card" key={index} style={{animationDelay:`${index*0.1}s`}}>
                    <strong>{c.name}</strong>
                    <div className="stars">
                        {"⭐".repeat(c.rating)}
                    </div>
                    <TypeWriter text={c.text}/>
                </div>
            ))}

        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
