<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XELIRA • Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --blue:#0d6efd;
    --white:#fff;
    --bg:#f0f4ff;
    --card:#fff;
    --border:#cfe0ff;
    --text:#111;
    --shadow:rgba(13,110,253,0.35);
}
*{box-sizing:border-box;font-family:Inter,sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--text);}

/* HEADER */
header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 20px;
    position:fixed;
    width:100%;
    top:0;
    background:var(--bg);
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

/* HAMBURGER */
.hamburger {
    position: relative;
    width: 30px;
    height: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    z-index: 300;
}

.hamburger .bar {
    height: 4px;
    background: var(--blue);
    border-radius: 2px;
    transition: all 0.4s ease;
    box-shadow: 0 0 8px var(--shadow);
}

.hamburger.active .bar1 {
    transform: rotate(45deg) translate(5px, 5px);
}

.hamburger.active .bar2 {
    transform: rotate(-45deg) translate(5px, -5px);
}

/* MENU */
.menu{
    position:absolute;
    top:60px;
    right:20px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:12px;
    width:230px;
    opacity:0;
    transform:translateY(-20px);
    pointer-events:none;
    transition:.4s;
    z-index:200;
    box-shadow:0 10px 25px rgba(13,110,253,0.2);
}
.menu.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}
.menu a{
    display:block;
    padding:14px;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--border);
    font-weight:500;
    transition:0.3s;
}
.menu a:hover{
    background:var(--blue);
    color:var(--white);
}

/* DASHBOARD */
.dashboard{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:120px 15px 30px;
}
.card{
    width:100%;
    max-width:560px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 25px var(--shadow);
}
.grid{
    border:1px dashed var(--border);
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
}
.grid h3{font-size:14px;color:var(--blue);margin-bottom:15px}
input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
}
button{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--blue);
    color:var(--white);
    font-weight:bold;
    cursor:pointer;
    transition:all 0.3s;
}
button:hover{
    background:#084fc7;
}

/* LOADING */
.loading{display:none;margin-top:25px}
.spinner{
    width:55px;height:55px;border:5px solid #cfe0ff;
    border-top:5px solid var(--blue);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}
.loading p{margin-top:12px;font-size:13px;color:#555}

/* RESULT */
.result{display:none;margin-top:25px}
.video-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    box-shadow:0 6px 20px var(--shadow);
}
.video-card video{
    width:100%;
    border-radius:12px;
    box-shadow:0 0 20px var(--shadow);
}

/* HELP */
.help{
    margin-top:25px;
    border-top:1px solid var(--border);
    padding-top:20px;
}
.help p{font-size:13px;color:#555}
.help a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:6px;
    padding:10px 14px;
    border-radius:12px;
    text-decoration:none;
    font-size:13px;
}
.whatsapp{background:#25D366;color:#fff}
.gmail{background:#d44638;color:#fff}

/* FOOTER */
footer{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:#666;
    border-top:1px solid var(--border);
}
footer span{color:var(--blue)}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<header>
    <div class="hamburger" id="hamburger">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
    </div>
</header>

<div class="menu" id="menu">
    <a href="historique.html">📜 Historique</a>
    <a href="annonce.html">📢 Annonce</a>
    <a href="commentaires.html">⭐ Commentaires</a>
</div>

<div class="dashboard">
<div class="card">

    <div class="grid">
        <h3>Collez le lien TikTok ci-dessous</h3>
        <input id="videoLink" placeholder="https://www.tiktok.com/...">
        <button onclick="downloadVideo()">Télécharger</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Traitement sécurisé par Xelira...</p>
    </div>

    <div class="result" id="result">
        <p style="color:var(--blue);font-weight:bold;margin-bottom:10px">
            ✔ Vidéo prête
        </p>
        <div class="video-card">
            <video controls id="resultVideo"></video>
            <a id="downloadBtn" class="whatsapp" style="display:block;margin-top:15px" download>
                ⬇ Télécharger MP4
            </a>
        </div>
    </div>

    <div class="help">
        <p>Support client ; problème technique :</p>
        <a class="whatsapp" href="https://wa.me/243861009310" target="_blank">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a class="gmail" href="mailto:xelirastudio@gmail.com">
            <i class="fas fa-envelope"></i> Gmail
        </a>
    </div>

</div>
</div>

<footer>© Xelira-studio — <span>Son Altesse</span></footer>

<script>
const hamburger = document.getElementById("hamburger");
const menu = document.getElementById("menu");

hamburger.addEventListener("click", () => {
    hamburger.classList.toggle("active");
    menu.classList.toggle("show");
});

async function downloadVideo(){
    const link = videoLink.value.trim();
    if(!link) return alert("Lien TikTok requis");

    loading.style.display="block";
    result.style.display="none";

    try{
        const api = `https://tikwm.com/api/?url=${encodeURIComponent(link)}`;
        const res = await fetch(api);
        const data = await res.json();

        if(data.code===0 && data.data.play){
            resultVideo.src = data.data.play;
            downloadBtn.href = data.data.play;
            downloadBtn.download = "xelira-video.mp4";

            // 🔥 HISTORIQUE
            const history = JSON.parse(localStorage.getItem("xelira_history")) || [];
            history.push({
                url:data.data.play,
                date:new Date().toLocaleString()
            });
            localStorage.setItem("xelira_history", JSON.stringify(history));

            loading.style.display="none";
            result.style.display="block";
        }else{
            loading.style.display="none";
            alert("Vidéo introuvable");
        }
    }catch(e){
        loading.style.display="none";
        alert("Erreur API ou réseau");
        console.error(e);
    }
}
</script>

</body>
</html>
