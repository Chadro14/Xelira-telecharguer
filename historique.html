<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XELIRA • Historique</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --blue:#0d6efd;
    --white:#fff;
    --bg:#f0f4ff;
    --card:#fff;
    --border:#cfe0ff;
    --text:#111;
    --shadow:rgba(13,110,253,0.35);
}

*{box-sizing:border-box;font-family:Inter,sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--text)}

/* HEADER */
header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid var(--border);
}
header h1{color:var(--blue); margin-bottom:5px;}
header p{color:var(--text)}

/* CONTAINER */
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* CLEAR BUTTON */
.clear{
    background:var(--blue);
    color:var(--white);
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
    transition:all 0.3s;
}
.clear:hover{
    background:#084fc7;
    transform:translateY(-2px);
}

/* GRID */
#list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
    gap:20px;
}

/* VIDEO ITEM */
.item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    box-shadow:0 6px 20px var(--shadow);
    transition:transform 0.3s, box-shadow 0.3s;
}
.item:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 30px var(--shadow);
}
.item video{
    width:100%;
    border-radius:12px;
    box-shadow:0 0 15px var(--shadow);
    transition:all 0.3s;
}
.item p{
    font-size:12px;
    color:var(--text);
    margin-top:8px;
    text-align:center;
}

/* EMPTY */
.empty{
    text-align:center;
    color:#666;
    margin-top:40px;
    font-style:italic;
}
</style>
</head>

<body>

<header>
    <h1>📜 Historique Xelira</h1>
    <p>Toutes les vidéos téléchargées</p>
</header>

<div class="container">
    <button class="clear" onclick="clearHistory()">🗑 Effacer l’historique</button>
    <div id="list"></div>
</div>

<script>
const list = document.getElementById("list");
const history = JSON.parse(localStorage.getItem("xelira_history")) || [];

function renderHistory(){
    list.innerHTML = "";
    if(history.length===0){
        list.innerHTML = "<p class='empty'>Aucune vidéo téléchargée</p>";
    }else{
        history.slice().reverse().forEach(v=>{
            const div = document.createElement("div");
            div.className="item";
            div.innerHTML=`
                <video controls src="${v.url}"></video>
                <p>Ajouté le : ${v.date}</p>
            `;
            list.appendChild(div);
        });
    }
}
renderHistory();

function clearHistory(){
    if(confirm("Supprimer tout l’historique ?")){
        localStorage.removeItem("xelira_history");
        history.length=0;
        renderHistory();
    }
}
</script>

</body>
</html>
