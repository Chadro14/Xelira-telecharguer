<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelira - L'Expérience Légendaire</title>
    <style>
        /* --- Couleurs Senior/Luxe --- */
        :root {
            --color-velvet: #1A1A2E; /* Noir très profond / Velours */
            --color-primary-senior: #C2185B; /* Rose Bourgogne (couleur de luxe) */
            --color-secondary: #F8F8FF; /* Blanc floral cassé */
            --color-accent-gold: #FFD700; /* Or Vif pour le luxe */
            --color-accent-light: #FFEDED; /* Rose très doux pour les reflets */
        }

        body {
            font-family: 'Times New Roman', Times, serif; /* Classique et senior */
            margin: 0;
            padding: 0;
            background-color: var(--color-velvet);
            color: var(--color-secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Style de la Carte de Vœux / Scène Centrale --- */
        .luxury-scene {
            text-align: center;
            padding: 60px 80px;
            background-color: var(--color-velvet);
            border: 5px solid var(--color-accent-gold); /* Cadre en or */
            box-shadow: 0 0 50px rgba(194, 24, 91, 0.5), /* Lueur rose luxueuse */
                        0 0 15px rgba(255, 215, 0, 0.8); /* Lueur d'or */
            max-width: 700px;
            border-radius: 10px;
            position: relative;
            z-index: 10;
        }

        /* --- Titre et Slogan (Légendaire) --- */
        h1 {
            font-family: 'Georgia', serif; 
            color: var(--color-accent-gold);
            font-size: 4.5em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 8px var(--color-primary-senior);
        }

        .subtitle {
            font-size: 1.5em;
            color: var(--color-secondary);
            margin-bottom: 5px;
            font-weight: 300;
        }

        .tagline {
            font-size: 1.1em;
            color: var(--color-primary-senior);
            margin-bottom: 50px;
            font-style: italic;
            border-bottom: 1px solid var(--color-primary-senior);
            padding-bottom: 10px;
        }

        /* --- Décorations de Noël (Minimalistes et Chics) --- */
        .decoration-line {
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                var(--color-accent-gold),
                var(--color-accent-gold) 10px,
                var(--color-primary-senior) 10px,
                var(--color-primary-senior) 20px
            );
            margin: 15px 0;
            opacity: 0.6;
        }

        /* --- Boutons --- */
        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 20px 15px;
            border: none;
            border-radius: 5px; 
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            transition: background-color 0.3s, transform 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        
        /* Bouton Senior Rose/Or */
        .btn-start {
            background-color: var(--color-primary-senior);
            color: var(--color-secondary);
            border: 2px solid var(--color-accent-gold);
            box-shadow: 0 5px 15px rgba(194, 24, 91, 0.5);
        }

        .btn-whatsapp {
            background-color: #4CAF50; 
            color: var(--color-secondary);
            border: 2px solid #388E3C;
        }
        
        .signature-altesse {
            margin-top: 40px;
            font-size: 0.9em;
            color: var(--color-accent-gold);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="luxury-scene">
        
        <div class="decoration-line"></div>
        <div class="subtitle">Saison Hivernale 2025</div>
        
        <h1>Xelira</h1>

        <div class="tagline">
            L'outil d'excellence professionnelle. Un service distingué pour vos médias.
        </div>
        
        <a href="dashboard.html" class="btn btn-start">DÉMARRER L'EXPÉRIENCE</a> 
        
        <a href="https://whatsapp.com/channel/0029VbBZq0E4o7qSZJvGYs2x" class="btn btn-whatsapp" target="_blank">REJOINDRE LA COMMUNAUTÉ</a>

        <p class="signature-altesse">
            By Altesse | Avec Élégance.
        </p>

        <div class="decoration-line"></div>
    </div>
</body>
</html>
