<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelira - Accueil Professionnel</title>
    <style>
        :root {
            --color-primary: #E91E63; /* Magenta */
            --color-secondary: #FAFAFA; 
            --color-text: #212121;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-secondary);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Écran d'Introduction Cinématique --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-text); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }
        .logo-container {
            font-size: 4em;
            font-weight: 700;
            letter-spacing: 0.2em;
            position: relative;
            color: transparent; 
            -webkit-text-stroke: 1px var(--color-primary); 
        }
        .logo-container::before {
            content: 'Xelira';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            color: var(--color-primary); 
            overflow: hidden;
            border-right: 4px solid var(--color-primary); 
            animation: text-reveal 2s steps(8) forwards,
                       blinking-cursor 0.7s infinite;
        }
        @keyframes text-reveal {
            0% { width: 0%; border-right: 4px solid var(--color-primary); }
            100% { width: 100%; border-right: none; }
        }
        @keyframes blinking-cursor {
            0%, 100% { border-color: var(--color-primary); }
            50% { border-color: transparent; }
        }

        /* --- Contenu Principal de la Page --- */
        .main-content {
            opacity: 0;
            transition: opacity 1s ease-in;
            text-align: center;
            max-width: 650px;
            padding: 20px;
        }
        h1 {
            color: var(--color-primary);
            font-size: 3em;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 1.2em;
            color: #616161;
            margin-bottom: 40px;
        }
        .signature {
            color: var(--color-primary);
            font-weight: 600;
            margin-top: 20px;
            font-style: italic;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 15px;
            border: none;
            border-radius: 30px; 
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }
        .btn-start {
            background-color: var(--color-primary);
            color: var(--color-secondary);
        }
        .btn-whatsapp {
            background-color: #4CAF50; 
            color: var(--color-secondary);
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div class="logo-container">Xelira</div>
    </div>

    <div class="main-content" id="main-content">
        <h1>Xelira-Music</h1>
        <p class="tagline">
            Bienvenue sur votre plateforme de téléchargement haute-fidélité pour musiques et vidéos, optimisée pour TikTok.
        </p>
        <p class="signature">
            By Son Altesse Royal.
        </p>

        <a href="dashboard.html" class="btn btn-start">➡️ COMMENCER MAINTENANT</a> 
        
        <a href="https://whatsapp.com/channel/0029VbBZq0E4o7qSZJvGYs2x" class="btn btn-whatsapp" target="_blank">💬 VOIR NOTRE COMMUNAUTÉ WHATSAPP</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');
            
            // Masque l'écran d'introduction après l'animation (3 secondes)
            setTimeout(() => {
                introScreen.style.opacity = '0';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainContent.style.opacity = '1';
                    document.body.style.overflow = 'auto'; 
                }, 1000); 
            }, 3000); 
        });
    </script>
    
</body>
</html>
