<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelira - Accueil Noël Pro</title>
    <style>
        :root {
            --color-primary-senior: #C2185B; /* Rose profond (Bourgogne) */
            --color-secondary: #F8F8FF; /* Blanc floral cassé */
            --color-accent: #FFD700; /* Or/Jaune Noël */
            --color-text: #212121;
        }
        body {
            font-family: 'Georgia', serif; /* Police plus senior */
            margin: 0;
            padding: 0;
            background-color: var(--color-secondary);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- Effet de Neige (Fond) --- */
        .snow-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            animation: snowfall 10s linear infinite;
        }
        @keyframes snowfall {
            from { background-position: 0 0; }
            to { background-position: 500px 500px; }
        }

        /* --- Écran d'Introduction Cinématique (plus simple/classe) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-primary-senior); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease-out;
        }
        .logo-text-senior {
            font-size: 5em;
            font-weight: bold;
            letter-spacing: 0.15em;
            color: var(--color-secondary);
            text-shadow: 0 0 10px var(--color-accent);
            opacity: 0;
            animation: fade-in-logo 2s ease-in-out 0.5s forwards;
            position: relative;
        }
        .logo-text-senior::after {
            content: '⭐';
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 0.4em;
            color: var(--color-accent);
        }
        @keyframes fade-in-logo {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- Contenu Principal de la Page --- */
        .main-content {
            opacity: 0;
            transition: opacity 1s ease-in;
            text-align: center;
            max-width: 650px;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.95); /* Fond pour la lisibilité */
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }
        h1 {
            color: var(--color-primary-senior);
            font-size: 3em;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 1.3em;
            color: var(--color-primary-senior);
            font-style: italic;
            margin-bottom: 40px;
        }
        .signature {
            color: var(--color-accent);
            font-weight: 600;
            margin-top: 30px;
            font-style: normal;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 15px;
            border: none;
            border-radius: 30px; 
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        .btn-start {
            background-color: var(--color-primary-senior);
            color: var(--color-secondary);
            box-shadow: 0 6px 12px rgba(194, 24, 91, 0.4);
        }
        .btn-whatsapp {
            background-color: #4CAF50; 
            color: var(--color-secondary);
        }
    </style>
</head>
<body>
    <div class="snow-background"></div>

    <div id="intro-screen">
        <div class="logo-text-senior">Xelira</div>
    </div>

    <div class="main-content" id="main-content">
        <h1>Xelira-Music</h1>
        <p class="tagline">
            Excellence et Féérie Numérique. L'outil professionnel pour vos médias.
        </p>
        
        <a href="dashboard.html" class="btn btn-start">➡️ COMMENCER MAINTENANT</a> 
        
        <a href="https://whatsapp.com/channel/0029VbBZq0E4o7qSZJvGYs2x" class="btn btn-whatsapp" target="_blank">💬 REJOINDRE LA COMMUNAUTÉ</a>

        <p class="signature">
            Un projet Altesse | Saison Hivernale 2025
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const introScreen = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');
            
            // Masque l'écran d'introduction après l'animation (4 secondes)
            setTimeout(() => {
                introScreen.style.opacity = '0';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainContent.style.opacity = '1';
                    document.body.style.overflow = 'auto'; 
                }, 1500); // Transition plus longue pour l'effet senior
            }, 4000); 
        });
    </script>
</body>
</html>
